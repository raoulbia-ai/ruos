[package]
name = "ruos-userland"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ruOS userland: PID 1 init, the ruosd AI system service, and the ai client"

[lib]
name = "ruos"
path = "src/lib.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
